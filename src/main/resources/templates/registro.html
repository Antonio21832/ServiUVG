<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ServiUVG</title>

    <style>
        :root {
            --verde: #164c38;
            --verde-oscuro: #103c2d;
            --crema: #f7f8f2;
            --lima: #d5ef91;
            --texto: #203c30;
            --error: #e74c3c;
            --exito: #2ecc71;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--crema);
            color: var(--texto);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ENCABEZADO */
        .encabezado {
            background: white;
        }

        .barra-superior {
            max-width: 1200px;
            margin: auto;
            padding: 20px 28px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: var(--verde);
            color: var(--lima);
            font-size: 21px;
            font-weight: 800;
            transform: rotate(-6deg);
            justify-self: start;
        }

        .nombre-sitio {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .nombre-sitio span {
            color: #548348;
        }

        /* NAVEGACIÓN */
        .navegacion {
            display: flex;
            justify-content: center;
            gap: 38px;
            padding: 0 20px;
            border-top: 1px solid #eef1ea;
            border-bottom: 1px solid #e2e8dd;
        }

        .navegacion a {
            padding: 17px 0;
            font-size: 14px;
            font-weight: 600;
            color: #647368;
            border-bottom: 3px solid transparent;
        }

        .navegacion a:hover {
            color: var(--verde);
            border-bottom-color: var(--verde);
        }

        main {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        h2 {
            color: var(--verde-oscuro);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .grupo-formulario {
            text-align: left;
            margin-bottom: 20px;
        }

        .grupo-formulario label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #647368;
        }

        .grupo-formulario input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dce5dc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .grupo-formulario input:focus {
            outline: none;
            border-color: var(--verde);
        }

        .btn-registro {
            width: 100%;
            background: var(--lima);
            color: var(--verde-oscuro);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-registro:hover {
            background: #e2f6b3;
            transform: translateY(-2px);
        }

        .enlace-login {
            margin-top: 20px;
            font-size: 14px;
            color: #647368;
        }

        .enlace-login a {
            color: var(--verde);
            font-weight: 600;
        }

        .enlace-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <div class="barra-superior">
            <a class="logo" href="/" aria-label="ServiUVG: inicio">S.</a>
            <a class="nombre-sitio" href="/">Servi<span>UVG</span></a>
            <div style="justify-self: end;"></div>
        </div>

        <nav class="navegacion" aria-label="Navegación principal">
            <a href="/">Inicio</a>
            <a href="/servicios">Servicios</a>
            <a href="/publicar">Publicar servicios</a>
            <a href="/contacto">Contáctanos</a>
        </nav>
    </header>

    <main>
        <h2>Crear Cuenta</h2>
        
        <div th:if="${param.error}" style="background-color: #fdeaea; color: #e74c3c; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;">
            El usuario ya existe. Por favor, elige otro nombre
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="grupo-formulario">
                <label for="nombre">Nombre de usuario:</label>
                <input type="text" id="nombre" th:field="*{nombre}" required autofocus />
            </div>
            
            <div class="grupo-formulario">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" th:field="*{password}" required />
            </div>
            
            <button type="submit" class="btn-registro">Registrarse</button>
        </form>

        <div class="enlace-login">
            ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
        </div>
    </main>
</body>
</html>
