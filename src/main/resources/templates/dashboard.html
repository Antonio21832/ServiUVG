<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - ServiUVG</title>

    <style>
        :root {
            --verde: #164c38;
            --verde-oscuro: #103c2d;
            --crema: #f7f8f2;
            --lima: #d5ef91;
            --texto: #203c30;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--crema);
            color: var(--texto);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ENCABEZADO */
        .encabezado {
            background: white;
        }

        .barra-superior {
            max-width: 1200px;
            margin: auto;
            padding: 20px 28px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: var(--verde);
            color: var(--lima);
            font-size: 21px;
            font-weight: 800;
            transform: rotate(-6deg);
            justify-self: start;
        }

        .nombre-sitio {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .nombre-sitio span {
            color: #548348;
        }

        /* NAVEGACIÓN */
        .navegacion {
            display: flex;
            justify-content: center;
            gap: 38px;
            padding: 0 20px;
            border-top: 1px solid #eef1ea;
            border-bottom: 1px solid #e2e8dd;
        }

        .navegacion a {
            padding: 17px 0;
            font-size: 14px;
            font-weight: 600;
            color: #647368;
            border-bottom: 3px solid transparent;
        }

        .navegacion a:hover {
            color: var(--verde);
            border-bottom-color: var(--verde);
        }

        /* CONTENIDO PRINCIPAL */
        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            color: var(--verde-oscuro);
            margin-top: 0;
        }

        p {
            font-size: 18px;
            color: #69766c;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }

        .btn-logout:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <div class="barra-superior">
            <a class="logo" href="/" aria-label="ServiUVG: inicio">S.</a>
            <a class="nombre-sitio" href="/">Servi<span>UVG</span></a>
            <div style="justify-self: end;"></div> <!-- Espacio vacío para mantener el centro del grid -->
        </div>

        <nav class="navegacion" aria-label="Navegación principal">
            <a href="/">Inicio</a>
            <a href="/servicios">Servicios</a>
            <a href="/publicar">Publicar servicios</a>
            <a href="/contacto">Contáctanos</a>
        </nav>
    </header>

    <main>
        <h1>Bienvenido al Sistema ServiUVG</h1>
        <p>Has iniciado sesión exitosamente.</p>

        <!-- Formulario de cierre de sesión conectado a Spring Security -->
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Cerrar Sesión</button>
        </form>
    </main>
</body>
</html>
